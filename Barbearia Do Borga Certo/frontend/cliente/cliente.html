<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Clientes - BarberShop</title>
    <link rel="stylesheet" href="../common.css">
</head>

<body onload="inicializar()">
    <header>
        <h1>&#9986;&#65039; BarberShop</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="../menu/menu.html">Inicio</a></li>
                <li><a href="../servico/servico.html">Servicos</a></li>
                <li><a href="../cliente/cliente.html">Clientes</a></li>
                <li><a href="../funcionario/funcionario.html">Barbeiros</a></li>
                <li><a href="../cargo/cargo.html">Cargos</a></li>
                <li><a href="../agendamento/agendamento.html">Agendamentos</a></li>
            </ul>
        </nav>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda" style="flex: 1 1 100%;">
                <h2>Dados do Cliente</h2>

                <label for="inputCpf">CPF (chave)</label>
                <div class="linha-id">
                    <input type="text" id="inputCpf" placeholder="Ex: 11122233344">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome">Nome Completo</label>
                <input type="text" id="inputNome">

                <label for="inputDataNascimento">Data de Nascimento</label>
                <input type="date" id="inputDataNascimento">

                <label for="inputEndereco">Endereco</label>
                <input type="text" id="inputEndereco">

                <label for="inputEmail">E-mail</label>
                <input type="email" id="inputEmail">

                <label for="inputSenha">Senha</label>
                <input type="password" id="inputSenha">

                <label for="inputDataCadastro">Data de Cadastro (cliente)</label>
                <input type="date" id="inputDataCadastro">

                <div id="divAviso">Informe o CPF e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-registros">
            <h3>Clientes Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>Eduardo Barzotto Iritsu &mdash; M32 &mdash; 2026</p>
        <p>&copy; 2026 BarberShop. Todos os direitos reservados.</p>
    </footer>

    <script src="./cliente.js"></script>
</body>

</html>
